name: Refresh model catalog

# Keeps the committed model catalog fresh WITHOUT making CI and release builds
# depend on live provider APIs: CI, publish and binaries build with
# `npm run build:offline`, which compiles the committed catalog (see
# docs/fork-policy.md). This job regenerates it from the provider catalogs on a
# schedule and opens a PR when it changed, so a human reviews and merges the diff.
#
# The catalog is the per-provider shards (src/providers/*.models.ts), the
# provider data (src/providers/data/*.json + .manifest.json) and the two
# aggregators (models.generated.ts, image-models.generated.ts): all of them must
# be in the PR, otherwise the aggregator would reference shards that are missing
# or stale.
#
# Note: a PR opened with the default GITHUB_TOKEN does not trigger the CI
# workflow; close and reopen it (or push to the branch) to run CI before merging.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-models
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate model catalog
        run: npm run generate --workspace=packages/ai

      - name: Validate regenerated model data
        run: npm run check:model-data

      - name: Open PR if the catalog changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(ai): refresh generated model catalog'
          title: 'chore(ai): refresh generated model catalog'
          body: |
            Automated weekly regeneration of the `packages/ai` model catalog:
            `src/providers/*.models.ts`, `src/providers/data/*.json`
            (+ `.manifest.json`), `src/models.generated.ts` and
            `src/image-models.generated.ts`.

            CI and release builds use `npm run build:offline` and compile the
            committed catalog, so they stay deterministic. Review the diff and
            merge to adopt the new models; a matching `packages/ai` version bump
            is required before publishing.
          branch: automated/refresh-models
          delete-branch: true
          add-paths: |
            packages/ai/src/models.generated.ts
            packages/ai/src/image-models.generated.ts
            packages/ai/src/providers/*.models.ts
            packages/ai/src/providers/data
