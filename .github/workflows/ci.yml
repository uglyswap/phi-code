name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint + format + types gate every PR, including fork PRs that bypass the
      # local pre-commit hook. `biome ci` fails on any diff instead of writing.
      - name: Lint & format
        run: npx biome ci .

      # routing-config.test.ts imports sigma-agents types, which live in dist/.
      # Build the sigma packages so the root typecheck can resolve them.
      - name: Build sigma packages for typecheck
        run: npm run build --workspace sigma-memory --workspace sigma-agents --workspace sigma-skills

      - name: Typecheck
        run: npx tsgo --noEmit

      # The published model catalog is a committed source file (see
      # docs/fork-policy.md). Fail if someone hand-edited it out of sync or a
      # build regenerated it — releases must match what is in git.
      - name: Model catalog is committed & clean
        run: git diff --exit-code packages/ai/src/models.generated.ts packages/ai/src/image-models.generated.ts

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # find/grep tool tests shell out to fd/rg (downloaded on demand, which is
      # blocked on CI runners).
      - name: Install fd and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          sudo ln -sf $(which fdfind) /usr/local/bin/fd

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
