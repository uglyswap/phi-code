name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      # Lifecycle scripts are not needed to lint and typecheck (and would run the
      # Camoufox downloader and the coding-agent postinstall on every PR).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Lint + format + types gate every PR, including fork PRs that bypass the
      # local pre-commit hook. `biome ci` fails on any diff instead of writing.
      - name: Lint & format
        run: npx biome ci .

      # routing-config.test.ts imports sigma-agents types, which live in dist/.
      # Build the sigma packages so the root typecheck can resolve them.
      - name: Build sigma packages for typecheck
        run: npm run build --workspace sigma-memory --workspace sigma-agents --workspace sigma-skills

      - name: Typecheck
        run: npx tsgo --noEmit

      # The published model catalog is a committed source file (see
      # docs/fork-policy.md). Fail if someone hand-edited it out of sync or a
      # build regenerated it — releases must match what is in git.
      - name: Model catalog is committed & clean
        run: git diff --exit-code packages/ai/src/models.generated.ts packages/ai/src/image-models.generated.ts

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # find/grep tool tests shell out to fd/rg (downloaded on demand, which is
      # blocked on CI runners).
      - name: Install fd and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          sudo ln -sf $(which fdfind) /usr/local/bin/fd

      # build:offline compiles the committed model catalog. The plain `build`
      # regenerates it live from provider APIs with --strict, so any provider
      # outage failed CI; refreshing the catalog is refresh-models.yml's job.
      - name: Build
        run: npm run build:offline

      # Full repo gate (lint, TS import style, install-lock, typecheck, browser
      # bundle smoke, web-ui). Runs after the build because web-ui type-checks
      # against the built workspace packages.
      - name: Check
        run: npm run check

      # Bundled extensions have their own tsconfig (not covered by the root typecheck).
      - name: Extensions typecheck
        run: npm run check:ext --workspace packages/coding-agent

      # The bundled extensions ship as source and are loaded by jiti against the
      # built core: typechecking alone misses import-time failures.
      - name: Extensions runtime smoke
        run: npm run check:extensions-smoke

      - name: Test
        run: npm test
