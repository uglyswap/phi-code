name: Install smoke

# End-to-end check of `npm install -g @phi-code-admin/phi-code` as a new user
# would run it, on Linux, macOS and Windows, BEFORE the versions are on npm:
# every public workspace package is packed, published to a local verdaccio
# (which proxies npmjs for third-party packages), then installed globally with
# install scripts enabled, a fresh HOME / PHI_CODING_AGENT_DIR and no API key.
# scripts/install-smoke/smoke.mjs then checks the CLI, native modules, the
# bundled extensions (memory embeddings, ast-grep, MCP, LSP, skills, agents),
# RPC mode, the TUI and the browser.

on:
  workflow_dispatch:
  push:
    # TEMPORARY (iteration on the CI branch): workflow_dispatch only works once the
    # workflow exists on the default branch. Remove ci/install-smoke before merging.
    branches: [main, ci/install-smoke]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/install-smoke.yml'

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    name: install-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build:offline

      - name: Pack public packages
        run: node scripts/install-smoke/pack.mjs "$RUNNER_TEMP/phi-install-smoke/tarballs"

      - name: Start local registry and publish
        run: |
          node scripts/install-smoke/registry.mjs start "$RUNNER_TEMP/phi-install-smoke/registry" "$RUNNER_TEMP/phi-install-smoke/tarballs/packages.json"
          node scripts/install-smoke/registry.mjs publish "$RUNNER_TEMP/phi-install-smoke/registry" "$RUNNER_TEMP/phi-install-smoke/tarballs/packages.json"

      # Scripts enabled, CI unset (the phi postinstall skips its setup under CI),
      # fresh HOME and agent dir: handled by install.mjs.
      - name: npm install -g @phi-code-admin/phi-code
        run: node scripts/install-smoke/install.mjs "$RUNNER_TEMP/phi-install-smoke/run" "$RUNNER_TEMP/phi-install-smoke/registry/npmrc"

      - name: Stop local registry
        if: always()
        run: node scripts/install-smoke/registry.mjs stop "$RUNNER_TEMP/phi-install-smoke/registry"

      - name: Smoke checks
        run: |
          version=$(node -p "require('./packages/coding-agent/package.json').version")
          node scripts/install-smoke/smoke.mjs "$RUNNER_TEMP/phi-install-smoke/run" "$version"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-logs-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/phi-install-smoke/run/install.log
            ${{ runner.temp }}/phi-install-smoke/run/tui-raw.txt
            ${{ runner.temp }}/phi-install-smoke/registry/verdaccio.log
