name: Install smoke

# End-to-end check of `npm install -g @phi-code-admin/phi-code` as a new user
# would run it, on Linux, macOS and Windows, BEFORE the versions are on npm:
# every public workspace package is packed, published to a local verdaccio
# (which proxies npmjs for third-party packages), then installed globally with
# install scripts enabled, a fresh HOME / PHI_CODING_AGENT_DIR and no API key.
# scripts/install-smoke/smoke.mjs then checks the CLI, native modules, the
# bundled extensions (memory embeddings, ast-grep, MCP, LSP, skills, agents),
# RPC mode, the TUI and the browser.

on:
  workflow_dispatch:
  push:
    # TEMPORARY (iteration on the CI branch): workflow_dispatch only works once the
    # workflow exists on the default branch. Remove ci/install-smoke before merging.
    branches: [main, ci/install-smoke]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/install-smoke.yml'

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    name: install-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build:offline

      - name: Pack public packages
        run: node scripts/install-smoke/pack.mjs "$RUNNER_TEMP/phi-install-smoke/tarballs"

      - name: Start local registry and publish
        run: |
          node scripts/install-smoke/registry.mjs start "$RUNNER_TEMP/phi-install-smoke/registry" "$RUNNER_TEMP/phi-install-smoke/tarballs/packages.json"
          node scripts/install-smoke/registry.mjs publish "$RUNNER_TEMP/phi-install-smoke/registry" "$RUNNER_TEMP/phi-install-smoke/tarballs/packages.json"

      # Scripts enabled, CI unset (the phi postinstall skips its setup under CI),
      # fresh HOME and agent dir: handled by install.mjs.
      - name: npm install -g @phi-code-admin/phi-code
        run: node scripts/install-smoke/install.mjs "$RUNNER_TEMP/phi-install-smoke/run" "$RUNNER_TEMP/phi-install-smoke/registry/npmrc"

      - name: Stop local registry
        if: always()
        run: node scripts/install-smoke/registry.mjs stop "$RUNNER_TEMP/phi-install-smoke/registry"

      - name: Smoke checks
        run: |
          version=$(node -p "require('./packages/coding-agent/package.json').version")
          node scripts/install-smoke/smoke.mjs "$RUNNER_TEMP/phi-install-smoke/run" "$version"

      # TEMPORARY diagnostic: process.exit() after an ONNX embedding aborts on macOS.
      # Which onnxruntime-node / transformers versions are affected?
      - name: Diagnose exit after embedding (temporary)
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/onnx-diag"
          mkdir -p "$D"
          cat > "$D/probe.mjs" <<'EOS'
          import { createRequire } from "node:module";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";
          import { Worker, isMainThread, parentPort, workerData } from "node:worker_threads";
          const [dir, mode] = isMainThread ? process.argv.slice(2) : workerData;
          async function embed() {
            const req = createRequire(join(dir, "x.cjs"));
            const t = await import(pathToFileURL(req.resolve("@huggingface/transformers")).href);
            const pipeline = t.pipeline ?? t.default.pipeline;
            const ort = req(join(dir, "node_modules", "onnxruntime-node", "package.json"));
            const extractor = await pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2", { dtype: "q8", cache_dir: join(dir, "models") });
            const out = await extractor("hello world", { pooling: "mean", normalize: true });
            return `transformers ok (${mode}), onnxruntime-node ${ort.version}, dims=${out.dims}`;
          }
          if (!isMainThread) parentPort.postMessage(await embed());
          else if (mode === "worker") {
            const w = new Worker(new URL(import.meta.url), { workerData: [dir, mode] });
            w.once("message", (m) => { console.log(m); process.exit(0); });
          } else {
            console.log(await embed());
            process.exit(0);
          }
          EOS
          for spec in "3.8.1|" "3.8.1|1.24.3" "3.8.1|1.30.0" "4.3.1|"; do
            tv=${spec%%|*}; ov=${spec##*|}; P="$D/t$tv-o$ov"; mkdir -p "$P"
            if [ -n "$ov" ]; then
              printf '{"private":true,"dependencies":{"@huggingface/transformers":"%s"},"overrides":{"onnxruntime-node":"%s"}}' "$tv" "$ov" > "$P/package.json"
            else
              printf '{"private":true,"dependencies":{"@huggingface/transformers":"%s"}}' "$tv" > "$P/package.json"
            fi
            (cd "$P" && npm install --no-audit --no-fund --loglevel=error > install.log 2>&1) || { echo "install failed for $spec"; tail -5 "$P/install.log"; }
            node "$D/probe.mjs" "$P" main; echo "transformers $tv onnxruntime-node ${ov:-default} main thread -> exit $?"
            node "$D/probe.mjs" "$P" worker; echo "transformers $tv onnxruntime-node ${ov:-default} worker thread -> exit $?"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-logs-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/phi-install-smoke/run/install.log
            ${{ runner.temp }}/phi-install-smoke/run/tui-raw.txt
            ${{ runner.temp }}/phi-install-smoke/registry/verdaccio.log
